<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172a">
    <title>よこスクロールアドベンチャー</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <div>
                <p class="eyebrow">MINI PLATFORMER</p>
                <h1>よこスクロールアドベンチャー</h1>
            </div>
            <p class="controls-hint">← → / A D で移動　・　Space / ↑ でジャンプ</p>
        </header>

        <section class="game-frame" aria-label="ゲーム画面">
            <canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム"></canvas>
            <div class="hud" aria-live="polite">
                <span>コイン <strong id="coin-count">0</strong> / <span id="coin-total">0</span></span>
                <span id="game-message">ゴールを目指そう！</span>
            </div>
            <div class="game-overlay" id="overlay">
                <div class="overlay-card">
                    <p class="eyebrow">READY?</p>
                    <h2 id="overlay-title">冒険に出発！</h2>
                    <p id="overlay-copy">コインを集めながら、ゴールの旗を目指そう。</p>
                    <button id="start-button" type="button">ゲームスタート</button>
                </div>
            </div>
        </section>

        <nav class="touch-controls" aria-label="タッチ操作">
            <button type="button" data-control="left" aria-label="左へ移動">◀</button>
            <button type="button" data-control="right" aria-label="右へ移動">▶</button>
            <button type="button" data-control="jump" aria-label="ジャンプ">ジャンプ</button>
        </nav>
        <p class="footer-note">トゲに触れるとスタート地点に戻ります。コインはクリア後も記録されます。</p>
    </main>
</body>
</html>
